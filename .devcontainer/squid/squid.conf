# Squid sidecar for the wonderwall devcontainer.
#
# Acts as an intercepting (SSL-bump) forward proxy so outbound HTTP(S)
# traffic from the devcontainer can be observed. Policy is log-all/allow-all:
# nothing is blocked, everything is logged (see entrypoint.sh, which tails
# the log files below into the container's stdout).

http_port 3128 ssl-bump \
    cert=/etc/squid/ssl_cert/squid-ca.pem \
    generate-host-certificates=on \
    dynamic_cert_mem_cache_size=4MB

sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 4MB
sslcrtd_children 5

acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump bump all

http_access allow all

# This proxy exists for visibility, not performance - skip the disk cache.
cache deny all

# Squid (running as cache_effective_user proxy) can't open /dev/stdout
# directly: it checks that a log's parent directory is writable by the
# effective user before opening, and /dev is root-owned. Log to real files
# under a directory proxy can write to instead; entrypoint.sh tails them
# into the container's actual stdout.
access_log stdio:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
